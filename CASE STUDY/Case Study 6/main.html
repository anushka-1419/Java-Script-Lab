<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JavaScript Case Study</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f0f8ff;
  }
  h2 {
    color: #333;
  }
  section {
    margin-bottom: 30px;
    background-color: #ffffff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    background-color: #4CAF50;
    color: white;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background-color: #45a049;
  }
  #result {
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>JavaScript Case Study</h1>

<!-- Section for reversing a string -->
<section>
  <h2>1. Reverse a String</h2>
  <input type="text" id="reverseInput" placeholder="Enter a string" />
  <button onclick="reverseString()">Reverse</button>
  <div id="reverseResult"></div>
</section>

<!-- Section for counting vowels -->
<section>
  <h2>2. Count Vowels in Paragraph</h2>
  <textarea id="paragraph" rows="5" placeholder="Enter paragraph text"></textarea>
  <button onclick="countVowels()">Count Vowels</button>
  <div id="vowelCount"></div>
</section>

<!-- Form for demonstrating event handling -->
<section>
  <h2>3. Form Event Handling</h2>
  <form id="sampleForm">
    <label for="name">Name:</label><br/>
    <input type="text" id="name" name="name" required /><br/>
    <label for="email">Email:</label><br/>
    <input type="email" id="email" name="email" required /><br/><br/>
    <button type="submit">Submit</button>
  </form>
  <div id="formMessage"></div>
</section>

<script>
  // Function to reverse a string
  function reverseString() {
    const input = document.getElementById('reverseInput').value;
    const reversed = input.split('').reverse().join('');
    document.getElementById('reverseResult').innerText = 'Reversed String: ' + reversed;
  }

  // Function to count vowels in paragraph
  function countVowels() {
    const paragraph = document.getElementById('paragraph').value.toLowerCase();
    const vowels = 'aeiou';
    let count = 0;
    for (let char of paragraph) {
      if (vowels.includes(char)) {
        count++;
      }
    }
    document.getElementById('vowelCount').innerText = 'Number of vowels: ' + count;
  }

  // Event handling for form submission
  document.getElementById('sampleForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent form from submitting
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    document.getElementById('formMessage').innerText = `Thank you, ${name}! Your email (${email}) has been received.`;
  });
</script>

</body>
</html>
