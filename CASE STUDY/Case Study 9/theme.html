<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        :root {
            --bg: #f4f7fb;
            --card: rgba(255,255,255,0.9);
            --text: #182033;
            --muted: #6b7280;
            --primary: #6366f1;
            --primary2: #8b5cf6;
            --border: #e5e7eb;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 15px 35px rgba(31,41,55,0.08);
        }

        body.dark {
            --bg: #0f172a;
            --card: #182235;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s;
        }

        /* HEADER */
        header {
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
        }

        .logo h2 {
            font-size: 21px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: var(--muted);
        }

        #themeBtn {
            border: none;
            background: var(--bg);
            color: var(--text);
            width: 43px;
            height: 43px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 19px;
            transition: 0.2s;
        }

        #themeBtn:hover {
            transform: rotate(20deg) scale(1.08);
        }

        /* MAIN */
        main {
            width: 86%;
            max-width: 1250px;
            margin: 35px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: clamp(25px, 4vw, 38px);
            margin-bottom: 7px;
        }

        .welcome p {
            color: var(--muted);
        }

        /* STAT CARDS */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .stat-card p {
            color: var(--muted);
            font-size: 13px;
        }

        .stat-card h2 {
            margin-top: 8px;
            font-size: 30px;
        }

        .stat-icon {
            font-size: 22px;
        }

        /* ADD TASK */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title h2 {
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 11px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .add-btn {
            margin-top: 15px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99,102,241,0.25);
        }

        /* TOOLBAR */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 220px;
        }

        .filter {
            width: 170px;
        }

        /* TASK GRID */
        #taskList {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .task {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: 0.25s;
            overflow: hidden;
        }

        .task:hover {
            transform: translateY(-4px);
        }

        .task.completed {
            opacity: 0.65;
        }

        .task.completed .task-title {
            text-decoration: line-through;
        }

        .task::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .priority {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .high {
            background: #fee2e2;
            color: #dc2626;
        }

        .medium {
            background: #fef3c7;
            color: #d97706;
        }

        .low {
            background: #d1fae5;
            color: #059669;
        }

        .task-title {
            font-size: 18px;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .task-date {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 18px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-actions button {
            flex: 1;
            padding: 9px;
            border: 1px solid var(--border);
            border-radius: 9px;
            cursor: pointer;
            background: var(--bg);
            color: var(--text);
        }

        .task-actions .complete {
            background: var(--success);
            color: white;
            border: none;
        }

        .task-actions .delete {
            color: var(--danger);
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
            grid-column: 1/-1;
        }

        /* PROGRESS */
        .progress-container {
            margin-top: 18px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--primary), var(--primary2));
            transition: width 0.5s;
        }

        /* RESPONSIVE */
        @media(max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr 1fr;
            }

            #taskList {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {
            main {
                width: 92%;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            #taskList {
                grid-template-columns: 1fr;
            }

            header {
                padding: 17px 4%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-icon">✓</div>
        <div>
            <h2>TaskFlow</h2>
            <span>Student Task Manager</span>
        </div>
    </div>

    <button id="themeBtn" title="Toggle Theme">🌙</button>
</header>


<main>

    <section class="welcome">
        <h1>Manage Your Tasks 🚀</h1>
        <p>Stay organized, track your progress and complete your goals.</p>
    </section>


    <!-- STATISTICS -->
    <section class="stats">

        <div class="stat-card">
            <div class="stat-icon">📋</div>
            <p>Total Tasks</p>
            <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <p>Pending</p>
            <h2 id="pendingTasks">0</h2>
        </div>

        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <p>Completed</p>
            <h2 id="completedTasks">0</h2>
        </div>

        <div class="stat-card">
            <div class="stat-icon">📊</div>
            <p>Progress</p>
            <h2 id="percentage">0%</h2>
        </div>

    </section>


    <!-- ADD TASK -->
    <section class="panel">

        <div class="panel-title">
            <h2>➕ Create New Task</h2>
        </div>

        <div class="form-grid">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter task name..."
            >

            <select id="priority">
                <option value="High">High Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="Low">Low Priority</option>
            </select>

            <select id="category">
                <option value="Study">📚 Study</option>
                <option value="Project">💻 Project</option>
                <option value="Personal">👤 Personal</option>
                <option value="Other">📌 Other</option>
            </select>

            <input type="date" id="dueDate">

        </div>

        <button class="add-btn" onclick="addTask()">
            Add Task
        </button>

    </section>


    <!-- TASK SECTION -->
    <section class="panel">

        <div class="panel-title">
            <h2>📌 My Tasks</h2>
        </div>

        <div class="toolbar">

            <input
                class="search"
                id="searchInput"
                type="text"
                placeholder="🔍 Search tasks..."
                oninput="renderTasks()"
            >

            <select
                class="filter"
                id="filter"
                onchange="renderTasks()"
            >
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>

        </div>

        <div id="taskList"></div>


        <!-- PROGRESS -->
        <div class="progress-container">

            <div class="progress-info">
                <span>Overall Progress</span>
                <span id="progressText">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </div>

    </section>

</main>


<script>

    /* =========================
       TASK DATA
    ========================= */

    let tasks = JSON.parse(localStorage.getItem("studentTasks")) || [];


    /* =========================
       THEME MANAGEMENT
    ========================= */

    const themeBtn = document.getElementById("themeBtn");

    let savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeBtn.textContent = "☀️";
    }

    themeBtn.addEventListener("click", () => {

        document.body.classList.toggle("dark");

        const darkMode =
            document.body.classList.contains("dark");

        localStorage.setItem(
            "theme",
            darkMode ? "dark" : "light"
        );

        themeBtn.textContent =
            darkMode ? "☀️" : "🌙";
    });


    /* =========================
       ADD TASK
    ========================= */

    function addTask() {

        const taskInput =
            document.getElementById("taskInput");

        const priority =
            document.getElementById("priority").value;

        const category =
            document.getElementById("category").value;

        const dueDate =
            document.getElementById("dueDate").value;


        const title = taskInput.value.trim();


        // INPUT VALIDATION
        if (title === "") {
            alert("⚠️ Please enter a task name.");
            taskInput.focus();
            return;
        }


        if (dueDate === "") {
            alert("⚠️ Please select a due date.");
            return;
        }


        const newTask = {

            id: Date.now(),

            title: title,

            priority: priority,

            category: category,

            dueDate: dueDate,

            completed: false

        };


        tasks.push(newTask);

        saveTasks();

        taskInput.value = "";
        document.getElementById("dueDate").value = "";

        renderTasks();

    }


    /* =========================
       SAVE TO LOCAL STORAGE
    ========================= */

    function saveTasks() {

        localStorage.setItem(
            "studentTasks",
            JSON.stringify(tasks)
        );

    }


    /* =========================
       RENDER TASKS
    ========================= */

    function renderTasks() {

        const list =
            document.getElementById("taskList");

        const search =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

        const filter =
            document.getElementById("filter").value;


        list.innerHTML = "";


        let filteredTasks = tasks.filter(task => {

            const matchesSearch =
                task.title
                .toLowerCase()
                .includes(search);


            const matchesFilter =
                filter === "all" ||

                (filter === "pending" &&
                 !task.completed) ||

                (filter === "completed" &&
                 task.completed);


            return matchesSearch && matchesFilter;

        });


        if (filteredTasks.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    <div style="font-size:45px">📭</div>
                    <h3>No tasks found</h3>
                    <p>Add a new task to get started.</p>
                </div>
            `;

        }


        filteredTasks.forEach(task => {

            const card =
                document.createElement("div");

            card.className =
                "task" +
                (task.completed ? " completed" : "");


            const priorityClass =
                task.priority.toLowerCase();


            card.innerHTML = `

                <div class="task-top">

                    <span class="priority ${priorityClass}">
                        ${task.priority}
                    </span>

                    <span>
                        ${getCategoryIcon(task.category)}
                    </span>

                </div>

                <h3 class="task-title">
                    ${escapeHTML(task.title)}
                </h3>

                <p class="task-date">
                    📅 Due: ${formatDate(task.dueDate)}
                </p>

                <p style="font-size:12px;color:var(--muted);margin-bottom:15px">
                    Category: ${task.category}
                </p>

                <div class="task-actions">

                    <button
                        class="complete"
                        onclick="toggleTask(${task.id})">
                        ${task.completed ? "↩ Undo" : "✓ Complete"}
                    </button>

                    <button
                        onclick="editTask(${task.id})">
                        ✏️ Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteTask(${task.id})">
                        🗑 Delete
                    </button>

                </div>
            `;


            list.appendChild(card);

        });


        updateStats();

    }


    /* =========================
       COMPLETE TASK
    ========================= */

    function toggleTask(id) {

        const task =
            tasks.find(t => t.id === id);

        if (task) {

            task.completed =
                !task.completed;

            saveTasks();

            renderTasks();

        }

    }


    /* =========================
       DELETE TASK
    ========================= */

    function deleteTask(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this task?");

        if (!confirmDelete) return;


        tasks =
            tasks.filter(task => task.id !== id);

        saveTasks();

        renderTasks();

    }


    /* =========================
       EDIT TASK
    ========================= */

    function editTask(id) {

        const task =
            tasks.find(t => t.id === id);

        if (!task) return;


        const newTitle =
            prompt("Edit task:", task.title);


        if (newTitle === null) return;


        const cleanTitle =
            newTitle.trim();


        if (cleanTitle === "") {

            alert("Task name cannot be empty.");

            return;

        }


        task.title = cleanTitle;

        saveTasks();

        renderTasks();

    }


    /* =========================
       STATISTICS
    ========================= */

    function updateStats() {

        const total = tasks.length;

        const completed =
            tasks.filter(t => t.completed).length;

        const pending =
            total - completed;


        const progress =
            total === 0
            ? 0
            : Math.round((completed / total) * 100);


        document.getElementById("totalTasks")
            .textContent = total;

        document.getElementById("pendingTasks")
            .textContent = pending;

        document.getElementById("completedTasks")
            .textContent = completed;

        document.getElementById("percentage")
            .textContent = progress + "%";

        document.getElementById("progressText")
            .textContent = progress + "%";

        document.getElementById("progressFill")
            .style.width = progress + "%";

    }


    /* =========================
       CATEGORY ICON
    ========================= */

    function getCategoryIcon(category) {

        const icons = {

            Study: "📚",

            Project: "💻",

            Personal: "👤",

            Other: "📌"

        };

        return icons[category] || "📌";

    }


    /* =========================
       DATE FORMATTER
    ========================= */

    function formatDate(date) {

        const d = new Date(date);

        return d.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }


    /* =========================
       SECURITY
       Prevent HTML injection
    ========================= */

    function escapeHTML(str) {

        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       KEYBOARD EVENT
       Enter = Add Task
    ========================= */

    document
        .getElementById("taskInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                addTask();
            }

        });


    /* =========================
       INITIAL LOAD
    ========================= */

    renderTasks();

</script>

</body>
</html>
